<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle</title>
</head>
<body>

  <header>
    <h1>Etkinlik Ekle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a> | 
      <a href="etkinlik-ekle.html">Ekle</a> | 
      <a href="etkinlik-guncelle.html">Guncelle</a>
    </nav>
  </header>

  <main>
    <form action="#" method="post">
      <p>
        <label for="etkinlik-adi">Etkinlik Adi:</label><br>
        <input type="text" id="etkinlik-adi" name="etkinlik-adi" required>
      </p>

      <p>
        <label for="kategori">Kategori:</label><br>
        <select id="kategori" name="kategori" required>
          <option value="">Seciniz</option>
          <option value="seminer">Seminer</option>
          <option value="atolye">Atolye</option>
          <option value="konferans">Konferans</option>
        </select>
      </p>

      <p>
        <label for="tarih">Tarih:</label><br>
        <input type="date" id="tarih" name="tarih" required>
      </p>

      <p>
        <label for="aciklama">Aciklama:</label><br>
        <textarea id="aciklama" name="aciklama" rows="4" cols="30" required></textarea>
      </p>

      <p>
        <button type="submit">Kaydet</button>
      </p>
    </form>
  </main>

  <footer>
    <p>Ad Soyad · 2026</p>
  </footer>

</body>
</html>
